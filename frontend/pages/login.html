<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini ERP - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/login.css" />
        <script src="../assets/js/config.js"></script>
    <script src="../assets/js/script.js"></script>
</head>
<body>
    <header>
        <div class="logo">MINI ERP</div>
        <nav class="nav-center">
            <a href="#">Produto</a>
            <a href="#">Suporte</a>
            <a href="#">Preços</a>
        </nav>
        <div class="nav-right">
            <a class="primeiro" id="primeiroAcesso">Primeiro Acesso</a>
            <a class="teste" id="testeGratis">Teste Grátis</a>
        </div>
    </header>

    <main>
        <h1>Acesse Sua Conta</h1>
        <div class="subtitle">Bem-vindo ao Mini ERP!</div>
        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required />
            <input type="password" id="password" placeholder="Digite a Senha" required />
            <button type="submit">Acessar sua Conta →</button>
        </form>
        <div class="forgot">Esqueceu a Senha?</div>
    </main>

    <footer>
        <div class="footer-left">Política de Privacidade</div>
        <div class="footer-right">Direitos © Lucas Pinheiro</div>
    </footer>

    <script src="../assets/js/login.js"></script>
</body>
</html>
